name: Burn-In

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Strategy to run for burn-in
        required: false
        default: momentum
  schedule:
    - cron: "5 12-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: burnin
  cancel-in-progress: false

jobs:
  burnin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_VERSION: "3.12"
      ARTIFACT_DIR: ci_artifacts/burnin
    steps:
      - name: Determine market checkpoint
        id: schedule
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "slot=manual" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          et_hour="$(TZ=America/New_York date +%H)"
          case "${et_hour}" in
            08)
              slot="pre-market"
              ;;
            11)
              slot="mid-morning"
              ;;
            14)
              slot="mid-afternoon"
              ;;
            17)
              slot="after-hours"
              ;;
            *)
              slot=""
              ;;
          esac

          if [[ -n "${slot}" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "slot=${slot}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip non-target hours
        if: steps.schedule.outputs.should_run != 'true'
        run: echo "Skipping this hourly trigger because it is outside the four target US market checkpoints."

      - name: Check out repository
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Validate burn-in environment secret
        if: steps.schedule.outputs.should_run == 'true'
        env:
          PAPER_BURNIN_ENV: ${{ secrets.PAPER_BURNIN_ENV }}
        shell: bash
        run: |
          if [[ -z "${PAPER_BURNIN_ENV}" ]]; then
            echo "Missing repository secret PAPER_BURNIN_ENV." >&2
            exit 1
          fi

      - name: Create burn-in environment file
        if: steps.schedule.outputs.should_run == 'true'
        env:
          PAPER_BURNIN_ENV: ${{ secrets.PAPER_BURNIN_ENV }}
        shell: bash
        run: printf '%s\n' "${PAPER_BURNIN_ENV}" > .env

      - name: Check Alpaca market calendar
        id: market_day
        if: steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          def load_env(path: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
              return values

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          slot = os.environ["SLOT"]
          if slot == "manual":
              with output_path.open("a", encoding="utf-8") as handle:
                  handle.write("is_market_day=true\nmarket_date=manual\n")
              with summary_path.open("a", encoding="utf-8") as handle:
                  handle.write("## Burn-In\n\nManual run requested; skipping market-holiday gate.\n")
              raise SystemExit(0)

          env = load_env(".env")
          market_date = datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          query = urlencode({"start": market_date, "end": market_date})
          request = Request(
              f"{env['ALPACA_BASE_URL'].rstrip('/')}/v2/calendar?{query}",
              headers={
                  "APCA-API-KEY-ID": env["ALPACA_API_KEY"],
                  "APCA-API-SECRET-KEY": env["ALPACA_SECRET_KEY"],
              },
              method="GET",
          )
          with urlopen(request, timeout=15) as response:
              payload = json.loads(response.read().decode("utf-8"))

          is_market_day = bool(payload)
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"is_market_day={'true' if is_market_day else 'false'}\n")
              handle.write(f"market_date={market_date}\n")
              if is_market_day:
                  handle.write(f"market_open={payload[0].get('open', '')}\n")
                  handle.write(f"market_close={payload[0].get('close', '')}\n")

          with summary_path.open("a", encoding="utf-8") as handle:
              if is_market_day:
                  handle.write(
                      "## Burn-In\n\n"
                      f"Scheduled run for `{market_date}` is a valid market day. "
                      f"Open `{payload[0].get('open', '')}` ET, close `{payload[0].get('close', '')}` ET.\n"
                  )
              else:
                  handle.write(
                      "## Burn-In\n\n"
                      f"Scheduled run for `{market_date}` was skipped because Alpaca returned no trading session for that date.\n"
                  )
          PY
        env:
          SLOT: ${{ steps.schedule.outputs.slot }}

      - name: Skip non-market days
        if: steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day != 'true'
        run: echo "Skipping scheduled run because today is not an Alpaca market day."

      - name: Create virtual environment
        if: steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day == 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day == 'true'
        run: .venv/bin/pip install -e .[dev]

      - name: Run burn-in workflow
        id: run_burnin
        if: steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day == 'true'
        env:
          STRATEGY: ${{ github.event.inputs.strategy || 'momentum' }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          cat > "${ARTIFACT_DIR}/run-metadata.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "slot": "${SLOT}",
            "strategy": "${STRATEGY}",
            "market_date": "${{ steps.market_day.outputs.market_date }}",
            "market_open_et": "${{ steps.market_day.outputs.market_open }}",
            "market_close_et": "${{ steps.market_day.outputs.market_close }}"
          }
          EOF

          echo "Running slot=${SLOT} strategy=${STRATEGY}" | tee "${ARTIFACT_DIR}/run.log"
          make burnin-day 2>&1 | tee "${ARTIFACT_DIR}/burnin-day.log"
          make burnin-review 2>&1 | tee "${ARTIFACT_DIR}/burnin-review.log"

      - name: Collect database snapshot
        if: always() && steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day == 'true'
        shell: bash
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          if [[ -f trading_burnin.db ]]; then
            cp trading_burnin.db "${ARTIFACT_DIR}/trading_burnin.db"
          fi

      - name: Commit burn-in logs to repository
        if: always() && steps.schedule.outputs.should_run == 'true' && steps.market_day.outputs.is_market_day == 'true'
        id: commit_logs
        shell: bash
        env:
          STRATEGY: ${{ github.event.inputs.strategy || 'momentum' }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/burnin

          if git diff --cached --quiet -- logs/burnin; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "chore: record burn-in logs for ${GITHUB_RUN_NUMBER} (${SLOT})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Publish job summary
        if: always() && steps.schedule.outputs.should_run == 'true'
        shell: bash
        env:
          STRATEGY: ${{ github.event.inputs.strategy || 'momentum' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo
            echo "### Run Summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${JOB_STATUS} |"
            echo "| Slot | ${{ steps.schedule.outputs.slot }} |"
            echo "| Strategy | ${STRATEGY} |"
            echo "| Market date | ${{ steps.market_day.outputs.market_date || 'n/a' }} |"
            echo "| Market day | ${{ steps.market_day.outputs.is_market_day || 'n/a' }} |"
            echo "| Logs committed | ${{ steps.commit_logs.outputs.committed || 'false' }} |"
            echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo
            if [[ -f "${ARTIFACT_DIR}/burnin-review.log" ]]; then
              echo "#### Review Tail"
              echo
              echo '```text'
              tail -n 20 "${ARTIFACT_DIR}/burnin-review.log"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Send failure alert
        if: failure() && steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def load_env(path: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#") or "=" not in line or line.startswith("export "):
                      continue
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
              return values

          env = load_env(".env")
          webhook_url = env.get("ALERT_WEBHOOK_URL", "")
          if not webhook_url:
              raise SystemExit(0)

          payload = {
              "text": (
                  f"Burn-In workflow failed for {os.environ['GITHUB_REPOSITORY']} "
                  f"slot={os.environ['SLOT']} strategy={os.environ['STRATEGY']} "
                  f"run={os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )
          }
          request = Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=10):
              pass
          PY
        env:
          SLOT: ${{ steps.schedule.outputs.slot }}
          STRATEGY: ${{ github.event.inputs.strategy || 'momentum' }}

      - name: Upload burn-in logs
        if: always() && steps.schedule.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: burnin-${{ github.run_number }}-${{ steps.schedule.outputs.slot }}
          path: |
            ${{ env.ARTIFACT_DIR }}/
            logs/burnin/
          if-no-files-found: warn
